<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Wovenfate</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #17141f; --surface: #1f1a2c; --ink: #ece4d6; --ink-dim: #a89dbd; --ember: #c97a3d; --border: #33293f; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; color: var(--ink); font-family: 'Inter', sans-serif;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #241c33 0%, var(--bg) 55%);
  }
  main {
    max-width: 440px; width: 100%; text-align: center; padding: 38px 28px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  }
  img { width: 48px; height: 48px; margin-bottom: 14px; }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ember); text-transform: uppercase; margin: 0 0 8px; }
  h1 { font-family: 'Fraunces', serif; font-size: 26px; margin: 0 0 10px; }
  p { color: var(--ink-dim); line-height: 1.6; margin: 0 0 22px; }
  a.btn {
    display: block; padding: 14px 18px; border-radius: 10px; text-decoration: none;
    background: var(--ember); color: #1f1408; font-weight: 600;
  }
  a.btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/wovenfate-icon-64.png" alt="">
  <p class="kicker">Page not found</p>
  <h1>This path leads nowhere</h1>
  <p>The page you were looking for doesn't exist — but five stories do.</p>
  <a class="btn" href="/">Browse the stories</a>
</main>
</body>
</html>
