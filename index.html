  <!-- Filenames carry a version suffix on purpose: iOS caches the
       home-screen/apple-touch icon very aggressively per URL, so
       overwriting icon-192.png's content in place is not guaranteed to
       ever reach a phone that already fetched it once. Bumping the
       filename (v2, v3, ...) forces every browser/OS to treat it as a
       new resource and actually re-fetch. Bump this again for any
       future icon change. -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v2.png" />
